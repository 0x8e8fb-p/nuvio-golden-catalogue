name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Lint (syntax, secret scan, no-emoji check, README links)
        run: npm run lint
      - name: Validate config and collections (no network)
        run: npm run validate:config
      - name: Unit tests
        run: npm test
